# «Сценика» — тот же артефакт сборки, что и у МЭПЛ. Фронтенд определяет
# домен по window.location.hostname и рендерит страницу с корня.

server {
    listen 80;
    listen [::]:80;
    server_name scenika.ru www.scenika.ru;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://scenika.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.scenika.ru;
    ssl_certificate     /etc/letsencrypt/live/scenika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scenika.ru/privkey.pem;
    return 301 https://scenika.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scenika.ru;

    ssl_certificate     /etc/letsencrypt/live/scenika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scenika.ru/privkey.pem;

    root /var/www/maple/current;
    index index.html;

    # На своём домене «Сценика» и так в корне: старый путь свернём сюда же
    location = /scenika  { return 301 https://scenika.ru/; }
    location = /scenika/ { return 301 https://scenika.ru/; }

    # Кейсы и портфолио живут на домене МЭПЛ
    location /cases { return 301 https://maple-media.ru$request_uri; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/scenika.access.log;
    error_log  /var/log/nginx/scenika.error.log;
}
