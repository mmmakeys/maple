# МЭПЛ — корневой сайт. Одна сборка раздаётся обоим доменам,
# страницу выбирает фронтенд по имени хоста (src/sites.ts).

server {
    listen 80;
    listen [::]:80;
    server_name maple-media.ru www.maple-media.ru;
    # certbot подставит сюда редирект на https после выпуска сертификата
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://maple-media.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.maple-media.ru;
    ssl_certificate     /etc/letsencrypt/live/maple-media.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maple-media.ru/privkey.pem;
    return 301 https://maple-media.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maple-media.ru;

    ssl_certificate     /etc/letsencrypt/live/maple-media.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maple-media.ru/privkey.pem;

    root /var/www/maple/current;
    index index.html;

    # «Сценика» переехала на свой домен: старый путь отдаём постоянным
    # редиректом, чтобы не плодить одинаковый контент на двух адресах
    location = /scenika  { return 301 https://scenika.ru/; }
    location = /scenika/ { return 301 https://scenika.ru/; }

    # Хешированные файлы сборки неизменяемы, их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: любой маршрут отдаёт оболочку, дальше маршрутизирует фронтенд
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Саму оболочку не кэшируем, иначе после выкатки останется старая
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    access_log /var/log/nginx/maple-media.access.log;
    error_log  /var/log/nginx/maple-media.error.log;
}
